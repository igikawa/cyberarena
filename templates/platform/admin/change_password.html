{% extends "base.html" %}
{% block title %}Смена пароля · CYBERARENA{% endblock %}
{% block content %}
<section class="auth-card">
    <p class="eyebrow">Безопасность аккаунта</p>
    <h1>Смена пароля администратора</h1>
    {% if user.must_change_password %}
    <p class="muted">Перед началом работы замените начальный пароль, заданный при установке.</p>
    {% endif %}
    <form method="post" action="/admin/change-password" class="stack-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Текущий пароль<input name="current_password" type="password" autocomplete="current-password" required></label>
        <label>Новый пароль<input name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <label>Повторите новый пароль<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
        <button class="button" type="submit">Сменить пароль</button>
    </form>
</section>
{% endblock %}
