<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#09111a">
    <title>{% block title %}Лаборатория · CYBERARENA{% endblock %}</title>
    <style>
        :root{color-scheme:dark;font:16px Inter,ui-sans-serif,system-ui,sans-serif;background:#09111a;color:#eaf4f3;--bg:#09111a;--panel:#101d27;--line:#263b46;--muted:#a4b7bf;--accent:#61e5b5;--violet:#b99aff}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% -20%,#153333 0,transparent 42%),var(--bg)}
        a{color:var(--accent);text-decoration:none}a:hover{color:#a6f4d6}
        .topbar{border-bottom:1px solid #1c303a;background:#09111add}.topbar-inner,main{width:min(1080px,calc(100% - 40px));margin:auto}
        .topbar-inner{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px}
        .brand{font-weight:850;letter-spacing:.13em;color:#eaf4f3}.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;border:1px solid var(--accent);border-radius:8px;color:var(--accent)}
        .top-links{display:flex;gap:18px;font-size:.9rem}main{padding:46px 0 80px}
        .eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.16em;font-size:.74rem;font-weight:800}
        h1{margin:8px 0 14px;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.045em}h2{font-size:1.25rem}
        p,li{color:var(--muted);line-height:1.7}.lede{max-width:700px;font-size:1.08rem}
        .hero{position:relative;overflow:hidden;margin-bottom:28px;padding:clamp(24px,5vw,46px);border:1px solid #285148;border-radius:20px;background:linear-gradient(125deg,#102820,#101d27 68%,#16172c)}
        .hero:after{content:"CTF";position:absolute;right:5%;top:12%;font-size:clamp(4rem,11vw,9rem);font-weight:900;letter-spacing:-.1em;color:#ffffff08}
        .hero>*{position:relative;z-index:1}.panel,.challenge-card,.terminal,.hint{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#13222d,#0e1922)}
        .panel{padding:clamp(20px,4vw,32px);margin-top:20px}.panel h2{margin-top:0}
        .challenge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
        .challenge-card{display:flex;min-height:205px;flex-direction:column;padding:22px;color:#eaf4f3;transition:transform .18s,border-color .18s}
        .challenge-card:hover{transform:translateY(-3px);border-color:#458c77;color:#eaf4f3}
        .card-top,.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}
        .tag,.difficulty,.points{display:inline-flex;align-items:center;padding:5px 9px;border:1px solid #315447;border-radius:99px;background:#102a27;color:#8ce7c3;font-size:.76rem}
        .difficulty{border-color:#45405f;background:#211d32;color:#c9b9ff}.points{border:0;background:transparent;color:var(--accent);font-weight:800}
        .challenge-card h2{margin:22px 0 8px}.challenge-card p{margin-bottom:16px}.card-bottom{margin-top:auto;padding-top:14px;border-top:1px solid #243943;color:#8498a0;font-size:.82rem}
        .task-meta{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}
        .task-meta span{padding:7px 10px;border:1px solid #263e48;border-radius:8px;background:#0b171f;color:#b7c6ce;font-size:.86rem}
        .terminal{margin:20px 0;padding:18px;overflow:auto;color:#a9f4d6;background:#071016;font: .9rem ui-monospace,SFMono-Regular,Consolas,monospace}
        code{color:#eaf4f3;background:#15232c;padding:.2em .4em;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
        .task-form{display:grid;gap:12px;max-width:620px;margin:22px 0}
        label{display:grid;gap:8px;color:#d9e6e9;font-weight:650}input{width:100%;padding:12px 13px;border:1px solid #344b57;border-radius:8px;background:#09141b;color:#eaf4f3;font:inherit}
        input:focus{outline:2px solid #61e5b566;border-color:var(--accent)}
        button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 16px;border:1px solid transparent;border-radius:8px;background:var(--accent);color:#07140f;font:inherit;font-weight:800;cursor:pointer}
        button:hover,.button:hover{background:#a6f4d6;color:#07140f}
        .hint{margin-top:24px;background:#111925}.hint summary{padding:15px 18px;color:#d2c4ff;font-weight:750;cursor:pointer;list-style:none}
        .hint summary::-webkit-details-marker{display:none}.hint summary:after{content:"+";float:right;color:var(--violet);font-size:1.25rem}
        .hint[open] summary:after{content:"−"}.hint-content{padding:0 18px 16px;border-top:1px solid #293143}.hint-content p:last-child{margin-bottom:0}
        .result-list{display:grid;gap:10px;padding:0;list-style:none}.result-list li,.file-view{padding:13px 15px;border:1px solid #253b45;border-radius:9px;background:#0b171f}
        .file-view{white-space:pre-wrap;overflow-wrap:anywhere;color:#c3d4d9}.footer{padding:22px 0;border-top:1px solid #1c303a;color:#748991;font-size:.82rem}
        @media(max-width:680px){.topbar-inner{align-items:flex-start;flex-direction:column;padding:14px 0}.top-links{flex-wrap:wrap}.challenge-grid{grid-template-columns:1fr}main{padding-top:32px}}
    </style>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
    <a class="brand" href="/lab/"><span class="brand-mark">C</span>CYBERARENA LAB</a>
    <nav class="top-links" aria-label="Навигация лаборатории"><a href="/lab/">Задания</a><a href="/">Платформа</a></nav>
</div></header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer"><div class="topbar-inner"><span>CYBERARENA · Изолированная учебная среда</span><span>Только синтетические данные</span></div></footer>
</body>
</html>
