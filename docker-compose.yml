name: cyberarena

services:
  nginx:
    image: nginx:stable-alpine
    user: "101:101"
    ports:
      # Доступ только с локального компьютера.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      # Не блокируем запуск платформы, если лаборатория недоступна.
      lab-web:
        condition: service_started
    networks:
      - edge-net
      - app-net
      - lab-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /var/run:size=1m,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /tmp:size=8m,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/platform/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cyberarena}:${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в файле .env}@db:5432/${POSTGRES_DB:-cyberarena}
      SECRET_KEY: ${SECRET_KEY:?Укажите SECRET_KEY в файле .env}
      FLAG_HMAC_KEY: ${FLAG_HMAC_KEY:?Укажите FLAG_HMAC_KEY в файле .env}
      LAB_FLAGS_FILE: /run/cyberarena/lab-flags/flags.json
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в файле .env}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - app-net
    volumes:
      - lab-flags:/run/cyberarena/lab-flags
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 20s
      timeout: 4s
      retries: 5
      start_period: 20s

  lab-web:
    build:
      context: .
      dockerfile: docker/lab/Dockerfile
    expose:
      - "8000"
    networks:
      # ВАЖНО: лаборатория подключена только к lab-net; app-net и SQLite ей недоступны.
      lab-net:
        ipv4_address: 172.30.254.10
    environment:
      LAB_FLAGS_FILE: /run/cyberarena/lab-flags/flags.json
    volumes:
      - lab-flags:/run/cyberarena/lab-flags:ro
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyberarena}
      POSTGRES_USER: ${POSTGRES_USER:-cyberarena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в файле .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.00

volumes:
  postgres-data:
    name: cyberarena-postgres-data
  lab-flags:
    name: cyberarena-lab-flags

networks:
  # Публикация порта Docker требует обычную bridge-сеть; masquerading для неё выключен.
  # В эту сеть подключён только Nginx.
  edge-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Внутренние сети без прямого выхода в интернет.
  app-net:
    internal: true
  lab-net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.0/24
