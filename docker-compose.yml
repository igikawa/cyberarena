name: cyberarena

services:
  nginx:
    image: nginx:1.28-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
    depends_on:
      app:
        condition: service_healthy
      lab-manager:
        condition: service_healthy
      grafana:
        condition: service_started
    networks:
      - edge-net
      - nginx-app-net
      - lab-proxy-net
      - grafana-proxy-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /var/run:size=1m,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
      - /tmp:size=8m,noexec,nosuid,nodev,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - app-metrics-net
      - lab-metrics-net
      - grafana-prometheus-net
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 64

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - grafana-proxy-net
      - grafana-prometheus-net
    restart: unless-stopped
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,uid=472,gid=472,mode=0700
      - /var/log/grafana:size=16m,noexec,nosuid,nodev,uid=472,gid=472,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64

  app:
    build:
      context: .
      dockerfile: docker/platform/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      FLAG_HMAC_KEY: ${FLAG_HMAC_KEY}
      LAB_MATERIALS_URL: http://lab-manager:8000/internal/materials
      LAB_MATERIALS_SECRET: ${LAB_MATERIALS_SECRET:?Set LAB_MATERIALS_SECRET in .env}
      LAB_MANAGER_URL: http://lab-manager:8000
      LAB_MANAGER_SECRET: ${LAB_MANAGER_SECRET:?Set LAB_MANAGER_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      REDIS_URL: redis://${REDIS_USER}:${REDIS_USER_PASSWORD}@redis:6379/0
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      - app-net
      - nginx-app-net
      - lab-control-net
      - app-metrics-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      lab-manager:
        condition: service_healthy
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 20s
      timeout: 4s
      retries: 5
      start_period: 20s

  docker-sandbox:
    build:
      context: .
      dockerfile: docker/dind/Dockerfile
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:docker-sandbox
    volumes:
      - docker-certs:/certs
      - docker-data:/var/lib/docker
      - ./docker/dind/daemon.json:/etc/docker/daemon.json:ro
    networks:
      docker-control-net:
        ipv4_address: 172.31.250.3
      dind-pull-net: {}
    restart: unless-stopped
    mem_limit: 3584m
    memswap_limit: 3584m
    cpus: 2.50
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - "docker info --format '{{json .Runtimes}}' | grep -q 'runsc'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  lab-manager:
    build:
      context: .
      dockerfile: docker/lab-manager/Dockerfile
    environment:
      DOCKER_HOST: tcp://docker-sandbox:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /run/docker-certs/client
      DOCKER_GATEWAY: 172.31.250.3
      LAB_MANAGER_SECRET: ${LAB_MANAGER_SECRET:?Set LAB_MANAGER_SECRET in .env}
      LAB_MATERIALS_SECRET: ${LAB_MATERIALS_SECRET:?Set LAB_MATERIALS_SECRET in .env}
    volumes:
      - docker-certs:/run/docker-certs:ro
    networks:
      - lab-control-net
      - docker-control-net
      - lab-proxy-net
      - lab-metrics-net
    depends_on:
      docker-sandbox:
        condition: service_healthy
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 96
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.00

  redis:
    image: redis:7.4-alpine
    user: "999:999"
    environment:
      REDIS_USER: ${REDIS_USER}
      REDIS_USER_PASSWORD: ${REDIS_USER_PASSWORD}
    networks:
      - app-net
    command:
      - sh
      - -c
      - |
        printf 'user default off\nuser %s on >%s ~cyberarena:* +get +set +del +incrby +ping +hello\n' "$$REDIS_USER" "$$REDIS_USER_PASSWORD" > /tmp/users.acl
        exec redis-server --aclfile /tmp/users.acl --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user \"$${REDIS_USER}\" --pass \"$${REDIS_USER_PASSWORD}\" ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.50


volumes:
  postgres-data:
    name: cyberarena-postgres-data
  prometheus-data:
    name: cyberarena-prometheus-data
  grafana-data:
    name: cyberarena-grafana-data
  docker-certs:
    name: cyberarena-docker-certs
  docker-data:
    name: cyberarena-docker-data

networks:
  edge-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  app-net:
    internal: true
  nginx-app-net:
    internal: true
  lab-control-net:
    internal: true
  lab-proxy-net:
    internal: true
  docker-control-net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
  dind-pull-net:
  app-metrics-net:
    internal: true
  lab-metrics-net:
    internal: true
  grafana-prometheus-net:
    internal: true
  grafana-proxy-net:
    internal: true
