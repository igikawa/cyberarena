global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cyberarena-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000

  - job_name: cyberarena-lab-manager
    metrics_path: /metrics
    static_configs:
      - targets:
          - lab-manager:8000
