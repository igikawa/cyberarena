server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /lab {
        return 308 /lab/;
    }

    location /lab/ {
        error_page 502 503 504 = /lab-unavailable.html;
        proxy_pass http://lab-web:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location = /lab-unavailable.html {
        internal;
        default_type text/html;
        return 503 "<!doctype html><html lang=\"ru\"><meta charset=\"utf-8\"><title>Лаборатория недоступна</title><h1>Лаборатория временно недоступна</h1><p>Попробуйте открыть ресурс позже или сообщите преподавателю.</p></html>";
    }

    location / {
        # Containers in lab-net may reach Nginx, but must not use it as a bridge to the platform.
        deny 172.30.254.0/24;
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}